
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: gastro-prometheus
    restart: unless-stopped
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gastro-network

  grafana:
    image: grafana/grafana:latest
    container_name: gastro-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./ops/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - gastro-network

  loki:
    image: grafana/loki:latest
    container_name: gastro-loki
    restart: unless-stopped
    volumes:
      - ./ops/monitoring/loki-config.yml:/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - gastro-network

  promtail:
    image: grafana/promtail:latest
    container_name: gastro-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./ops/monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - gastro-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: gastro-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - gastro-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: gastro-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - gastro-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  gastro-network:
    external: true   # используем существующую сеть из основного compose