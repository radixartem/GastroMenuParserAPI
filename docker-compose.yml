version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/GastroLeinefeldeAPI/Dockerfile
    container_name: gastro-api
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=gastro_menu;Username=postgres;Password=postgres
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs
    networks:
      - gastro-network

  postgres:
    image: postgres:16-alpine
    container_name: gastro-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gastro_menu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gastro-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gastro-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - gastro-network

volumes:
  postgres_data:

networks:
  gastro-network:
    driver: bridge