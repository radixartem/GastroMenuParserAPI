services:

  caddy:
    image: caddy:2-alpine
    container_name: gastro-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - api

    networks:
      - gastro-network


  api:
    build:
      context: .
      dockerfile: src/GastroLeinefeldeAPI/Dockerfile

    container_name: gastro-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=gastro_menu;Username=postgres;Password=postgres

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - gastro-network


  postgres:
    image: postgres:16-alpine
    container_name: gastro-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gastro_menu

    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d gastro_menu"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - gastro-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  gastro-network: