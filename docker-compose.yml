services:
  caddy:
    image: caddy:2-alpine
    container_name: gastro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - gastro-network

  api:
    # Образ из GHCR, тег задаётся через переменную окружения VERSION
    image: ghcr.io/your-org/gastro-api:${VERSION:-latest}
    container_name: gastro-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Строка подключения берётся из .env
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gastro-network
    # Для сбора метрик (если используется Prometheus)
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"   # если ваше API отдаёт метрики

  postgres:
    image: postgres:16-alpine
    container_name: gastro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gastro_menu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gastro_menu}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - gastro-network

volumes:
  postgres_data:
    # Если том создан через Terraform, можно оставить external: true
    # external: true
  caddy_data:
  caddy_config:

networks:
  gastro-network:
    # Если сеть создана Terraform, укажите external: true
    # external: true